watched_ssids:
  - "Home_WiFi"
  - "Office_Guest"
watched_bssids: []
deauth_threshold: 15
interface: wlan0
dwell_time: 2
blocklist_macs: []
discord_webhook_url: ""

# Active mitigation (offensive deauth).
# The tool deauths ONLY the BSSIDs listed in scope_bssids, and only when started
# with --arm. Load scope_bssids from your signed rules of engagement. Leave it
# empty to run passive: recon and detection only, nothing transmitted.
active_mitigation:
  scope_bssids: []      # authorized target BSSIDs (your ROE)
  frame_count: 0        # 0 = continuous deauth until stopped; set N for an N-frame burst
